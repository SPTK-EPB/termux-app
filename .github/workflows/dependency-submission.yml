name: Automatic Dependency Submission

on:
  push:
    branches: [ 'master' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v6
      with:
        # Scope the submitted graph to the SHIPPED release runtime classpath only.
        # Without this filter the action submits the entire build + plugin classpath
        # (Android Gradle Plugin / R8 / bundletool / apksigner transitives: netty,
        # grpc, protobuf, bouncycastle, jose4j, jdom2, ...), none of which ship in the
        # APK. Those generated ~45 non-actionable Dependabot alerts (and kept growing
        # with AGP's transitive churn). This scopes alerts to the real attack surface.
        dependency-graph-include-configurations: '^releaseRuntimeClasspath$'
